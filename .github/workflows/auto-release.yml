name: Release (auto)

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version depuis Cargo.toml
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Vérifier si la release v${{ steps.version.outputs.version }} existe déjà
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer Rust + cible wasm32-wasip2
        if: steps.check.outputs.released == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.released == 'false'

      - name: Build (wasm32-wasip2)
        if: steps.check.outputs.released == 'false'
        run: cargo build --release

      - name: Vérifier le binaire WASM
        if: steps.check.outputs.released == 'false'
        run: test -f target/wasm32-wasip2/release/rpumpkin.wasm

      - name: Créer le tag + la release GitHub v${{ steps.version.outputs.version }}
        if: steps.check.outputs.released == 'false'
        run: gh release create "v${{ steps.version.outputs.version }}" --target "${{ github.sha }}" --generate-notes target/wasm32-wasip2/release/rpumpkin.wasm

      - name: Publier sur le Pumpkin Market
        if: steps.check.outputs.released == 'false'
        run: |
          curl --fail-with-body -sS -X PUT "https://market.pumpkinmc.org/api/plugins/157" \
            -H "Authorization: Bearer ${{ secrets.PUMPKIN_MARKET_TOKEN }}" \
            -F "wasm=@target/wasm32-wasip2/release/rpumpkin.wasm;type=application/wasm" \
            -F "metadata={\"version\":\"${{ steps.version.outputs.version }}\",\"track\":\"alpha\"}"
