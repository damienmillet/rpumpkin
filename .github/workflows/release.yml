name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build (wasm32-wasip2)
        run: cargo build --release

      - name: Vérifier le binaire WASM
        run: test -f target/wasm32-wasip2/release/rpumpkin.wasm

      - name: Extraire la version du tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: target/wasm32-wasip2/release/rpumpkin.wasm
          generate_release_notes: true

      - name: Publier sur le Pumpkin Market
        run: |
          curl --fail-with-body -sS -X PUT "https://market.pumpkinmc.org/api/plugins/157" \
            -H "Authorization: Bearer ${{ secrets.PUMPKIN_MARKET_TOKEN }}" \
            -F "wasm=@target/wasm32-wasip2/release/rpumpkin.wasm;type=application/wasm" \
            -F "metadata={\"version\":\"${{ steps.version.outputs.version }}\",\"track\":\"alpha\"}"
