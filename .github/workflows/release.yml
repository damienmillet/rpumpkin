name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build (wasm32-wasip2)
        run: cargo build --release

      - name: Vérifier le binaire WASM
        run: test -f target/wasm32-wasip2/release/rpumpkin.wasm

      - name: Extraire la version du tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: target/wasm32-wasip2/release/rpumpkin.wasm
          generate_release_notes: true

      - name: Publier sur le Pumpkin Market
        uses: filiphsps/pumpkin-plugins/actions/publish-to-pumpkin-market@publish-to-pumpkin-market-v0.0.7
        with:
          plugin-name: rpumpkin
          version: ${{ steps.version.outputs.version }}
          wasm-file: target/wasm32-wasip2/release/rpumpkin.wasm
          api-token: ${{ secrets.PUMPKIN_MARKET_TOKEN }}
          track: alpha
