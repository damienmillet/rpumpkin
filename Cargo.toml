[package]
name = "rpumpkin"
version = "0.0.1"
edition = "2021"
description = "Solution unifiée pour ajouter des notions de RolePlay Minecraft dans un serveur Pumpkin"
license = "MIT OR Apache-2.0"

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.1+26.3-26.51" }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
cesu8 = "1"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true

